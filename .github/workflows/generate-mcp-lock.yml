name: Generate MCP lockfile

on:
  push:
    branches:
      - "mcp/remote-server"

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: mcp/remote-server

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock remote MCP dependencies [skip ci]"
          git push origin HEAD:mcp/remote-server
