name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "mcp/**"
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build Remote MCP
        run: npm run build:mcp

      - name: Verify Remote MCP bundle
        run: test -s dist-mcp/server.mjs

      - name: Smoke-test Remote MCP
        shell: bash
        run: |
          set -euo pipefail
          HOST=127.0.0.1 PORT=3001 node dist-mcp/server.mjs > /tmp/yw3-mcp.log 2>&1 &
          mcp_pid=$!
          trap 'kill "$mcp_pid" 2>/dev/null || true' EXIT

          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3001/healthz > /dev/null; then
              break
            fi
            sleep 0.25
          done

          curl --fail --silent http://127.0.0.1:3001/healthz | grep -Fq 'ok'

          curl --fail --silent             -H 'Content-Type: application/json'             -H 'Accept: application/json, text/event-stream'             --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1.0.0"}}}'             http://127.0.0.1:3001/mcp             | grep -Fq 'yw3-iv-calculator'

      - name: Build Remote MCP container
        run: docker build --file Dockerfile.mcp --tag yw3-iv-calculator-mcp:test .

      - name: Verify crawler policy
        run: |
          test -f dist/robots.txt
          grep -Fq 'User-agent: *' dist/robots.txt
          grep -Fq 'Allow: /' dist/robots.txt
          grep -Fq 'name="robots"' dist/index.html
          grep -Fq 'index, follow' dist/index.html
