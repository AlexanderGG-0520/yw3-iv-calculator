name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify crawler policy
        run: |
          test -f dist/robots.txt
          grep -Fq 'User-agent: *' dist/robots.txt
          grep -Fq 'Allow: /' dist/robots.txt
          grep -Fq 'name="robots"' dist/index.html
          grep -Fq 'index, follow' dist/index.html
