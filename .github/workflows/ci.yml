name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Emit generated fallback
        shell: bash
        run: |
          printf '%s\n' '===YW3_FALLBACK_BEGIN==='
          base64 -w0 src/engine/yokaiData.generated.ts
          printf '\n%s\n' '===YW3_FALLBACK_END==='
