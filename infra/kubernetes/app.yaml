apiVersion: apps/v1
kind: Deployment
metadata:
  name: yw3-iv-calculator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yw3-iv-calculator
  template:
    metadata:
      labels:
        app: yw3-iv-calculator
    spec:
      containers:
        - name: web
          image: ghcr.io/alexandergg-0520/yw3-iv-calculator:21306ecad363dd2b6daf31b2fb0b2cf46d9e6431
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
        - name: mcp
          image: ghcr.io/alexandergg-0520/yw3-iv-calculator-mcp:21306ecad363dd2b6daf31b2fb0b2cf46d9e6431
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
--- 
apiVersion: v1
kind: Service
metadata:
  name: yw3-iv-calculator
spec:
  selector:
    app: yw3-iv-calculator
  ports:
    - port: 80
      targetPort: 80
